[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "thesisgrid"
version = "0.1.0"
description = "Same thesis, every instrument, one grid: shares, perps, options and prediction-market binaries on one price x time P&L grid."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["options", "perpetuals", "prediction-markets", "kalshi", "polymarket", "hyperliquid", "black-scholes"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7", "pandas>=1.5"]

[project.urls]
Homepage = "https://hunterm777.github.io/ThesisGrid/"
Repository = "https://github.com/hunterm777/ThesisGrid"

[tool.maturin]
python-source = "python"
module-name = "thesisgrid._thesisgrid"
features = ["pyo3/extension-module"]
